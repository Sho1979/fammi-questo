<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Fammi Questo Voice Ripple Logo -->
  <!-- Central circle -->
  <circle cx="100" cy="90" r="18" fill="#6C5CE7"/>

  <!-- Left arcs (violet) - voice waves going left -->
  <path d="M72 60 A45 45 0 0 0 72 120" stroke="#6C5CE7" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M58 48 A60 60 0 0 0 58 132" stroke="#6C5CE7" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M45 38 A75 75 0 0 0 45 142" stroke="#6C5CE7" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Right arcs (coral) - voice waves going right -->
  <path d="M128 60 A45 45 0 0 1 128 120" stroke="#FF6B6B" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M142 48 A60 60 0 0 1 142 132" stroke="#FF6B6B" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M155 38 A75 75 0 0 1 155 142" stroke="#FF6B6B" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>
</svg>
