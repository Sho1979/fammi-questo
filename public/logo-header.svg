<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 52" fill="none">
  <!-- Fammi Questo Unified Logo — Rounded pill container -->
  <!-- Background pill shape -->
  <rect x="0" y="0" width="280" height="52" rx="26" fill="white" fill-opacity="0.15"/>
  <rect x="0.5" y="0.5" width="279" height="51" rx="25.5" stroke="white" stroke-opacity="0.25"/>

  <!-- Voice Ripple Icon (compact) -->
  <!-- Central dot -->
  <circle cx="32" cy="26" r="5.5" fill="white"/>

  <!-- Left arcs -->
  <path d="M23 16 A14 14 0 0 0 23 36" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M18 11 A19 19 0 0 0 18 41" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Right arcs (coral tint) -->
  <path d="M41 16 A14 14 0 0 1 41 36" stroke="#FFB8B8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M46 11 A19 19 0 0 1 46 41" stroke="#FFB8B8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Divider line -->
  <line x1="58" y1="12" x2="58" y2="40" stroke="white" stroke-opacity="0.3" stroke-width="1"/>

  <!-- FAMMI QUESTO text -->
  <text x="68" y="31" fill="white" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="800" letter-spacing="3">FAMMI QUESTO</text>
</svg>
